  <circle cx="1126" cy="150" r="7" fill="#1a7f37"/>
  <circle cx="1126" cy="150" r="7" fill="none" stroke="#1a7f37" stroke-width="2">
    <animate attributeName="r" values="7;22" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="1126" y="204" text-anchor="end" font-family="ui-monospace, 'Cascadia Code', Consolas, 'Courier New', monospace" font-size="15" fill="#59636e">online</text>
